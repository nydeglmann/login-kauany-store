<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kauany Store</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card">
      <div class="topo">
        <h1>Kauany Store <span class="laco">🎀</span></h1>
        <p>Cadastro de clientes</p>
      </div>

      <form>
        <label>Nome</label>
        <input
          type="text"
          placeholder="Digite seu nome"
          required
          minlength="3"
        />

        <label>E-mail</label>
        <input type="email" placeholder="Digite seu e-mail" required />

        <label>Idade</label>
        <input
          type="number"
          placeholder="Digite sua idade"
          required
          min="0"
          max="120"
        />

        <button type="submit">Cadastrar</button>
      </form>
    </div>
  </body>
</html>
